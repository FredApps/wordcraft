name: French proofing
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: french-proofing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  french:
    name: French (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - windows-latest
        - macos-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.98.1
        components: rustfmt
    - name: Record pinned compiler and check formatting
      run: 'rustc --version --verbose

        cargo --version

        cargo fmt --all -- --check

        '
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Download and verify Dicollecte 7.7
      env:
        WORDCRAFT_DICTIONARIES: ${{ runner.temp }}/wordcraft-french-dictionary
      shell: python
      run: "import hashlib\nimport os\nfrom pathlib import Path\nfrom urllib.request import urlopen\nrevision = \"67032ee957631908098a72edf48dc81cac27e369\"\nbase = f\"https://raw.githubusercontent.com/LibreOffice/dictionaries/{revision}/fr_FR/dictionaries\"\ndirectory = Path(os.environ[\"WORDCRAFT_DICTIONARIES\"])\ndirectory.mkdir(parents=True, exist_ok=True)\nfor name, sha256 in {\n    \"fr.aff\": \"c176610cd5dc4846806a65ddd029f422d87978bf58f224aa44222662a16a2de5\",\n    \"fr.dic\": \"b78a868e31dd6e373b6c3217969afb898a9acde828a5e7ef97308da42218c88c\",\n}.items():\n    with urlopen(f\"{base}/{name}\", timeout=60) as response:\n        data = response.read(64 * 1024 * 1024 + 1)\n    if hashlib.sha256(data).hexdigest() != sha256:\n        raise RuntimeError(f\"Dictionary checksum mismatch: {name}\")\n    (directory / name).write_bytes(data)\n"
    - name: Synthetic proofing and non-French compatibility regressions
      run: cargo test --locked -p wordcraft-proof
    - name: Required real French dictionary gate
      env:
        WORDCRAFT_DICTIONARIES: ${{ runner.temp }}/wordcraft-french-dictionary
      run: cargo test --locked -p wordcraft-proof --test french_dictionary -- --ignored
    - name: Review commands in French
      shell: python
      run: "import subprocess\ncommand = [\"cargo\", \"test\", \"--locked\", \"-p\", \"wordcraft-engine\", \"--lib\", \"french_proofing_through_the_review_commands\"]\nlisted = subprocess.run(command + [\"--\", \"--list\"], check=True, capture_output=True, text=True)\nprint(listed.stdout)\nmatches = [line for line in listed.stdout.splitlines() if line.endswith(\": test\") and \"french_proofing_through_the_review_commands\" in line]\nif len(matches) != 1:\n    raise RuntimeError(f\"Expected exactly one French Review regression, found {len(matches)}\")\nsubprocess.run(command, check=True)\n"

# Added by the review board's fork CI only (never part of the upstream PR): runs the platforms the
# repository's own CI doesn't cover, against the PR's merge commit.
name: Review platforms

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  wasm:
    name: wasm32 (cargo xtask wasm)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable + wasm32)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: wasm32 check
        run: cargo xtask wasm
